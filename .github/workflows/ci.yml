name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./llm-wiki"
          additional_files: "uninstall.sh bootstrap.sh"

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            INSTALLATION.md
            AGENT.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            SUPPORT.md
            FAQ.md
            llm-wiki/**/*.md
            .github/**/*.md

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bootstrap.sh test pushes this checkout into a
          # local bare repo, and a shallow clone cannot be pushed
          # ("shallow update not allowed").
          fetch-depth: 0
      - name: Run integration tests
        run: |
          set -e
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"

          echo "=== Testing init-wiki.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/init-wiki.sh"

          echo "=== Testing hash-files.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/hash-files.sh" ./wiki

          echo "=== Creating test pages ==="
          cat > ./wiki/test-concept.md << 'EOF'
          ---
          title: "Test Concept"
          type: concept
          language: en
          created: "2026-04-30"
          modified: "2026-04-30"
          tags: [test, example]
          summary: "A test page for CI validation"
          ---
          # Test Concept
          This is a test page. See [[other-page]] for more.
          EOF

          cat > ./wiki/other-page.md << 'EOF'
          ---
          title: "Other Page"
          type: article
          language: en
          created: "2026-04-30"
          modified: "2026-04-30"
          tags: [test]
          summary: "Another test page"
          ---
          # Other Page
          This links back to [[test-concept]].
          EOF

          # A non-page USAGE_GUIDE.md must not trip any page check below.
          cat > ./wiki/USAGE_GUIDE.md << 'EOF'
          # Test Wiki — Knowledge Base Guide

          Start at `index.md`. A link like [[example-page-that-does-not-exist]]
          resolves to that slug plus `.md` in the wiki root.
          EOF

          echo "=== Testing validate-frontmatter.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/validate-frontmatter.sh" ./wiki

          echo "=== Testing find-broken-links.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/find-broken-links.sh" ./wiki || echo "WARNING: find-broken-links.sh found issues (non-zero exit)"

          echo "=== Testing find-orphans.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/find-orphans.sh" ./wiki || echo "WARNING: find-orphans.sh found issues (non-zero exit)"

          echo "=== Testing install.sh --help ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/install.sh" --help

          echo "=== Testing agent-install.sh (isolated HOME) ==="
          FAKE_HOME="$(mktemp -d)"
          HOME="$FAKE_HOME" bash "$GITHUB_WORKSPACE/llm-wiki/scripts/agent-install.sh"
          test -L "$FAKE_HOME/.agents/skills/llm-wiki"
          test -L "$FAKE_HOME/.claude/skills/llm-wiki"
          test -L "$FAKE_HOME/.claude/CLAUDE.md"
          test -L "$FAKE_HOME/.claude/commands/wiki-onboard.md"
          test -f "$FAKE_HOME/.llm-wiki-installed"
          grep -q "session-start.sh" "$FAKE_HOME/.claude/settings.json"
          # Idempotent re-run must be a no-op
          HOME="$FAKE_HOME" bash "$GITHUB_WORKSPACE/llm-wiki/scripts/agent-install.sh" | grep -q "already installed"
          rm -rf "$FAKE_HOME"

          echo "=== Testing agent-install.sh for codex, pi, bob (isolated HOMEs) ==="
          for h in codex pi bob; do
            FAKE_HOME="$(mktemp -d)"
            HOME="$FAKE_HOME" LLM_WIKI_HARNESS="$h" bash "$GITHUB_WORKSPACE/llm-wiki/scripts/agent-install.sh"
            test -L "$FAKE_HOME/.agents/skills/llm-wiki"
            test ! -e "$FAKE_HOME/.claude/CLAUDE.md"
            case "$h" in
              codex) test -L "$FAKE_HOME/.codex/AGENTS.md"; test -L "$FAKE_HOME/.codex/prompts/wiki-onboard.md" ;;
              pi)    test -L "$FAKE_HOME/.pi/agent/AGENTS.md"; test -L "$FAKE_HOME/.pi/agent/prompts/wiki-onboard.md"; test -L "$FAKE_HOME/.pi/agent/skills/llm-wiki" ;;
              bob)   test -L "$FAKE_HOME/.bob/rules/llm-wiki.md"; test -L "$FAKE_HOME/.claude/skills/llm-wiki"; test -L "$FAKE_HOME/.bob/skills/llm-wiki" ;;
            esac
            HOME="$FAKE_HOME" bash "$GITHUB_WORKSPACE/uninstall.sh" --force
            test ! -e "$FAKE_HOME/.agents/skills/llm-wiki"
            test ! -e "$FAKE_HOME/.codex/AGENTS.md"
            test ! -e "$FAKE_HOME/.pi/agent/AGENTS.md"
            test ! -e "$FAKE_HOME/.bob/rules/llm-wiki.md"
            rm -rf "$FAKE_HOME"
          done

          echo "=== Testing bootstrap.sh (local bare remote, isolated HOME) ==="
          BARE="$(mktemp -d)/origin.git"
          git init --bare -b main "$BARE"
          git -C "$GITHUB_WORKSPACE" push -q "$BARE" HEAD:refs/heads/main
          BOOT_HOME="$(mktemp -d)"
          # Installs into $HOME/.llm-wiki-agent; must NOT touch the CWD
          HOME="$BOOT_HOME" LLM_WIKI_REPO="$BARE" bash "$GITHUB_WORKSPACE/bootstrap.sh"
          test -f "$BOOT_HOME/.llm-wiki-agent/llm-wiki/SKILL.md"
          test "$(readlink "$BOOT_HOME/.claude/skills/llm-wiki")" = "$BOOT_HOME/.llm-wiki-agent/llm-wiki"
          test "$(readlink "$BOOT_HOME/.claude/CLAUDE.md")" = "$BOOT_HOME/.llm-wiki-agent/AGENT.md"
          test -f "$BOOT_HOME/.claude/commands/wiki-onboard.md"
          test -f "$BOOT_HOME/.llm-wiki-installed"
          grep -q "session-start.sh" "$BOOT_HOME/.claude/settings.json"
          # Re-run is a no-op
          HOME="$BOOT_HOME" LLM_WIKI_REPO="$BARE" bash "$GITHUB_WORKSPACE/bootstrap.sh" | grep -q "already installed"
          # Uninstall removes the agent definition (isolated HOME, forced)
          HOME="$BOOT_HOME" bash "$GITHUB_WORKSPACE/uninstall.sh" --force
          test ! -e "$BOOT_HOME/.llm-wiki-agent"
          test ! -e "$BOOT_HOME/.llm-wiki-installed"
          cd "$TMPDIR"
          rm -rf "$BOOT_HOME" "$(dirname "$BARE")"

          cd /tmp
          rm -rf "$TMPDIR"
          echo "=== All integration tests passed ==="
